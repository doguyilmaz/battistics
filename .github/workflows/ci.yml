name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # macos-26 image: builds link against the macOS 26 SDK so the app gets
    # the current system appearance (Liquid Glass) instead of compatibility mode.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Core and MCP tests
        run: swift test
      - name: Build app
        run: |
          xcodegen generate
          xcodebuild -project Battistics.xcodeproj -scheme Battistics \
            -configuration Debug -derivedDataPath .build/xcode build \
            CODE_SIGN_IDENTITY="-"
      - name: Bundled MCP protocol smoke test
        run: python3 scripts/test-mcp-stdio.py
      - name: Command lifecycle integration
        run: python3 scripts/test-cli.py
      - name: App automation integration
        run: python3 scripts/test-automation.py
      - name: iPhone remote integration
        run: python3 scripts/test-automation.py --remote
      - name: Build iPhone app
        run: |
          xcodebuild -project Battistics.xcodeproj -scheme BattisticsPhone \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath .build/xcode build
