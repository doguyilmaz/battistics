name: Release

# Ships when main gets a CHANGELOG version that has no tag yet, or when a
# vX.Y.Z tag is pushed. project.yml is stamped from that version before
# generating the project.
on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - id: resolve
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          VERSION=$(awk '/^## /{ print $2; exit }' CHANGELOG.md)
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Top of CHANGELOG is \"$VERSION\": nothing to release."
            exit 0
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "v$VERSION is already tagged: nothing to release."
            exit 0
          fi
          # Pushed with GITHUB_TOKEN, which does not start another run.
          git tag "v$VERSION" "$GITHUB_SHA"
          git push origin "v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  release:
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: macos-26
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Import signing certificate
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASS=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          echo "$CERT_P12" | base64 --decode > cert.p12
          security import cert.p12 -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          rm cert.p12
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain

      - name: Stamp version
        run: |
          sed -E -i '' "s/CFBundleShortVersionString: \"[^\"]*\"/CFBundleShortVersionString: \"$VERSION\"/" project.yml
          sed -E -i '' "s/CFBundleVersion: \"[^\"]*\"/CFBundleVersion: \"$VERSION\"/" project.yml

      - name: Core tests
        run: swift test

      - name: Build signed DMG
        env:
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: make dmg

      - name: Notarize and staple
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          xcrun notarytool submit dist/Battistics-*.dmg \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$NOTARY_PASSWORD" --wait
          xcrun stapler staple dist/Battistics-*.dmg

      - name: Generate signed appcast
        env:
          SPARKLE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          rm -rf dist/release && mkdir -p dist/release
          cp "dist/Battistics-$VERSION.dmg" dist/release/
          KEY_FILE="$RUNNER_TEMP/sparkle_key"
          printf '%s' "$SPARKLE_KEY" > "$KEY_FILE"
          .build/xcode/SourcePackages/artifacts/sparkle/Sparkle/bin/generate_appcast dist/release \
            --ed-key-file "$KEY_FILE" \
            --download-url-prefix "https://github.com/doguyilmaz/battistics/releases/download/v${VERSION}/"
          rm "$KEY_FILE"
          # appcast-2.xml is the live feed. generate_appcast already names it
          # that, because it derives the filename from SUFeedURL in the app's
          # Info.plist; the mv is only a guard in case that stops being true.
          # appcast.xml stays the frozen informational feed for pre-1.1.0
          # builds, whose bundle identifier Sparkle will not update across.
          [ -f dist/release/appcast-2.xml ] || mv dist/release/appcast.xml dist/release/appcast-2.xml
          cp scripts/legacy-appcast.xml dist/release/appcast.xml

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Release notes come from the CHANGELOG section for this version,
          # so the page reads like the changelog rather than a commit list.
          awk -v want="## $VERSION" '
            $0 == want { found = 1; next }
            /^## / { if (found) exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if [ -s "$RUNNER_TEMP/notes.md" ]; then
            NOTES=(--notes-file "$RUNNER_TEMP/notes.md")
          else
            NOTES=(--generate-notes)
          fi
          gh release create "v$VERSION" \
            dist/release/Battistics-*.dmg \
            dist/release/appcast-2.xml dist/release/appcast.xml \
            --title "Battistics-$VERSION" "${NOTES[@]}"

      # Publishes the Homebrew cask. Runs last and hashes the DMG that was
      # uploaded rather than the one `make dmg` built: stapling the
      # notarization ticket rewrites the image, so the two differ.
      #
      # github.token is scoped to this repository and cannot write to the tap,
      # so this needs a HOMEBREW_TAP_GITHUB_TOKEN secret with contents write on it. Without
      # one the step says so and succeeds — a stale cask is worth less than a
      # release pipeline that keeps working.
      - name: Update Homebrew tap
        env:
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: ./scripts/update-tap.sh "$VERSION" dist/release/Battistics-*.dmg
