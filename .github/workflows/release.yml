name: Release

# A release starts when main gets a CHANGELOG version that has no tag yet or
# when a vX.Y.Z tag is pushed. On main the version job only pushes the tag
# with the tapster tag key. That tag starts this workflow again: the tag run
# builds the app, signs it ad hoc and opens a draft release for the tapster
# hub, which signs, notarizes and publishes it and writes the feed and the
# cask.
on:
  push:
    branches: [main]
    paths: [CHANGELOG.md]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
permissions: {}
jobs:
  version:
    if: ${{ github.event_name == 'push' && github.ref_type == 'branch' }}
    runs-on: ubuntu-24.04
    environment: release
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ssh-key: "${{ secrets.TAPSTER_TAG_KEY }}" }
      - name: Read the version from CHANGELOG
        id: resolve
        run: |
          set -euo pipefail
          VERSION=$(awk '/^## /{ print $2; exit }' CHANGELOG.md)
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Top of CHANGELOG is \"$VERSION\": nothing to release."
            exit 0
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "v$VERSION is already tagged: nothing to release."
            exit 0
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Push the release tag
        if: ${{ steps.resolve.outputs.version != '' }}
        env: { VERSION: "${{ steps.resolve.outputs.version }}" }
        run: git tag "v$VERSION" && git push origin "v$VERSION"
  build:
    if: ${{ github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' }}
    # macos-26 links against the macOS 26 SDK, so the app gets the current
    # system appearance instead of compatibility mode.
    runs-on: macos-26
    permissions: { contents: read }
    steps:
      - name: Refuse anything but a tag
        if: ${{ github.ref_type != 'tag' }}
        run: |
          echo "::error::Run this workflow on a tag like v1.2.3."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Core tests
        run: swift test
      - name: Build the app, signed ad hoc
        env: { TAG: "${{ github.ref_name }}" }
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::$TAG is not a tag like v1.2.3."
            exit 1
          fi
          export VERSION="${TAG#v}"
          sed -E -i '' "s/CFBundleShortVersionString: \"[^\"]*\"/CFBundleShortVersionString: \"$VERSION\"/" project.yml
          sed -E -i '' "s/CFBundleVersion: \"[^\"]*\"/CFBundleVersion: \"$VERSION\"/" project.yml
          make app
          for key in CFBundleShortVersionString CFBundleVersion; do
            test "$(/usr/libexec/PlistBuddy -c "Print $key" dist/Battistics.app/Contents/Info.plist)" = "$VERSION"
          done
          codesign --verify --strict --deep dist/Battistics.app
      - name: Pack the app
        env: { TAG: "${{ github.ref_name }}" }
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/out"
          tar -C dist --no-mac-metadata --no-xattrs -czf "$RUNNER_TEMP/out/Battistics-${TAG#v}.app.tar.gz" Battistics.app
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: app, path: "${{ runner.temp }}/out", if-no-files-found: error, retention-days: 1 }
  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions: { contents: write, id-token: write, attestations: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: { name: app, path: dist }
      - name: List the files
        run: |
          set -euo pipefail
          # The frozen feed for copies older than 1.1.0. The hub checks it
          # against the digest pinned under carry in tapster.yml.
          cp "scripts/legacy-appcast.xml" "dist/appcast.xml"
          cd dist && sha256sum -- * > checksums.txt
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: ${{ !github.event.repository.private }}
        with: { subject-checksums: dist/checksums.txt }
      - name: Hand the draft to the tapster hub
        env: { GH_TOKEN: "${{ github.token }}", TAG: "${{ github.ref_name }}" }
        run: |
          set -euo pipefail
          awk -v want="## ${TAG#v}" '$0 == want { found = 1; next } /^## / { if (found) exit } found { print }' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if [ -s "$RUNNER_TEMP/notes.md" ]; then notes=(--notes-file "$RUNNER_TEMP/notes.md"); else notes=(--generate-notes); fi
          gh release create "$TAG" dist/* --draft --verify-tag --title "Battistics-${TAG#v}" "${notes[@]}"
      - name: Ring the tapster hub
        if: ${{ vars.TAPSTER_DOORBELL != '' }}
        continue-on-error: true
        env: { DOORBELL: "${{ vars.TAPSTER_DOORBELL }}" }
        run: |
          set -euo pipefail
          token=$(curl -fsS -G --data-urlencode "audience=$DOORBELL" -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -r .value)
          echo "::add-mask::$token"
          curl -fsS -X POST -H "Authorization: Bearer $token" "$DOORBELL"
