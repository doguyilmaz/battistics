name: Battistics
options:
  bundleIdPrefix: com.dogukyilmaz
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  BattisticsCore:
    path: BattisticsCore
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ARCHS: arm64
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES

targets:
  Battistics:
    type: application
    platform: macOS
    sources:
      - path: App
    dependencies:
      - package: BattisticsCore
      - package: Sparkle
    info:
      path: App/Support/Info.plist
      properties:
        CFBundleDisplayName: Battistics
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "0.1.0"
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: "MIT License"
        SUFeedURL: https://github.com/doguyilmaz/battistics/releases/latest/download/appcast.xml
        SUEnableAutomaticChecks: true
        SUPublicEDKey: REPLACE_WITH_SPARKLE_PUBLIC_KEY
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dogukyilmaz.Battistics
        PRODUCT_NAME: Battistics
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: YES

schemes:
  Battistics:
    build:
      targets:
        Battistics: all
    run:
      config: Debug
