name: Battistics
options:
  bundleIdPrefix: com.dogukyilmaz
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  BattisticsCore:
    path: .
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.0"

fileGroups:
  - README.md
  - CHANGELOG.md
  - RELEASING.md
  - Makefile
  - project.yml
  - scripts

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ARCHS: arm64
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES

targets:
  Battistics:
    type: application
    platform: macOS
    sources:
      - path: Sources/BattisticsApp
    dependencies:
      - package: BattisticsCore
      - package: Sparkle
    info:
      path: Sources/BattisticsApp/Support/Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, tr]
        CFBundleDisplayName: Battistics
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "0.1.0"
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: "© 2026 Dogu Yilmaz · MIT License"
        CFBundleURLTypes:
          - CFBundleURLName: com.dogukyilmaz.Battistics
            CFBundleURLSchemes: [battistics]
        SUFeedURL: https://github.com/doguyilmaz/battistics/releases/latest/download/appcast.xml
        SUEnableAutomaticChecks: true
        SUPublicEDKey: j6ODlGaJePRaQypW8ezxZQBAwj2+TkAo0Sg/51fPN8o=
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dogukyilmaz.Battistics
        PRODUCT_NAME: Battistics
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SWIFT_EMIT_LOC_STRINGS: YES

schemes:
  Battistics:
    build:
      targets:
        Battistics: all
    run:
      config: Debug
