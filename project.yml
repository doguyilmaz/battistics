name: Battistics
options:
  bundleIdPrefix: com.doguyilmaz
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  BattisticsCore:
    path: .
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: "2.10.0"
  MCP:
    url: https://github.com/modelcontextprotocol/swift-sdk.git
    exactVersion: "0.12.1"

fileGroups:
  - README.md
  - CHANGELOG.md
  - RELEASING.md
  - Makefile
  - project.yml
  - scripts

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ARCHS: arm64
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES

targets:
  BattisticsCLI:
    type: tool
    platform: macOS
    sources: [Sources/BattisticsCLI]
    dependencies:
      - package: BattisticsCore
    settings:
      base:
        PRODUCT_NAME: battistics
        PRODUCT_BUNDLE_IDENTIFIER: com.doguyilmaz.Battistics.CLI
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
        SKIP_INSTALL: YES

  BattisticsMCP:
    type: tool
    platform: macOS
    sources: [Sources/BattisticsMCP]
    dependencies:
      - package: BattisticsCore
      - package: MCP
        product: MCP
    settings:
      base:
        PRODUCT_NAME: battistics-mcp
        PRODUCT_BUNDLE_IDENTIFIER: com.doguyilmaz.Battistics.MCP
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
        SKIP_INSTALL: YES

  # Privileged helper. A separate root process by necessity: setting power
  # preferences needs root, and the alternative is prompting on every change.
  BattisticsPowerHelper:
    type: tool
    platform: macOS
    sources:
      - path: Sources/PowerHelper
        excludes: [Support]
    dependencies:
      - package: BattisticsCore
    settings:
      base:
        PRODUCT_NAME: BattisticsPowerHelper
        PRODUCT_BUNDLE_IDENTIFIER: com.doguyilmaz.Battistics.PowerHelper
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
        # A command line tool has no bundle, so its identity has to live in a
        # __TEXT,__info_plist section. Apple's SMAppService helper samples do
        # this; launchd has nowhere else to read the helper's identifier from.
        INFOPLIST_FILE: Sources/PowerHelper/Support/HelperInfo.plist
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES

  Battistics:
    type: application
    platform: macOS
    sources:
      - path: Sources/BattisticsApp
      # SMAppService looks for the daemon's plist here, by label.
      - path: Sources/PowerHelper/Support/com.doguyilmaz.Battistics.PowerHelper.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchDaemons
    dependencies:
      - package: BattisticsCore
      - package: BattisticsCore
        product: BattisticsRemote
      - package: Sparkle
      - target: BattisticsCLI
        codeSign: true
        copy:
          # Keep the lowercase CLI separate from the Battistics app executable
          # on macOS volumes with case-insensitive filenames.
          destination: wrapper
          subpath: Contents/Helpers
      - target: BattisticsMCP
        codeSign: true
        copy:
          destination: executables
      # Lands in Contents/MacOS, which is what the plist's BundleProgram
      # points at. `embed: false` here would suppress the copy phase entirely.
      - target: BattisticsPowerHelper
        codeSign: true
        copy:
          destination: executables
    info:
      path: Sources/BattisticsApp/Support/Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, tr]
        CFBundleDisplayName: Battistics
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "0.1.0"
        LSUIElement: true
        NSBluetoothAlwaysUsageDescription: >-
          Battistics reads the battery level that connected keyboards, mice and
          headphones publish over Bluetooth. It is only used to show those levels
          in the Peripherals view, and nothing leaves this Mac.
        NSLocationUsageDescription: >-
          Battistics reads the current Wi‑Fi or Personal Hotspot network name so
          Battistics Remote on your iPhone can show which network your Mac is on.
        NSLocationWhenInUseUsageDescription: >-
          Battistics reads the current Wi‑Fi or Personal Hotspot network name so
          Battistics Remote on your iPhone can show which network your Mac is on.
        NSLocationAlwaysAndWhenInUseUsageDescription: >-
          Battistics reads the current Wi‑Fi or Personal Hotspot network name so
          Battistics Remote on your iPhone can show which network your Mac is on.
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: "© 2026 Dogu Yilmaz · MIT License"
        CFBundleURLTypes:
          - CFBundleURLName: com.doguyilmaz.Battistics
            CFBundleURLSchemes: [battistics]
        SUFeedURL: https://github.com/doguyilmaz/battistics/releases/latest/download/appcast-2.xml
        SUEnableAutomaticChecks: true
        SUPublicEDKey: j6ODlGaJePRaQypW8ezxZQBAwj2+TkAo0Sg/51fPN8o=
    entitlements:
      path: Sources/BattisticsApp/Support/Battistics.entitlements
      properties:
        com.apple.developer.aps-environment: development
        com.apple.developer.icloud-container-environment: Development
        com.apple.developer.icloud-container-identifiers: [iCloud.com.doguyilmaz.Battistics]
        com.apple.developer.icloud-services: [CloudKit]
    attributes:
      SystemCapabilities:
        com.apple.iCloud:
          enabled: 1
        com.apple.Push:
          enabled: 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.doguyilmaz.Battistics
        PRODUCT_NAME: Battistics
        DEVELOPMENT_TEAM: 5MYT4VYJFC
        CODE_SIGN_IDENTITY: "Apple Development"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SWIFT_EMIT_LOC_STRINGS: YES

  BattisticsPhone:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/BattisticsPhone
      - path: Sources/BattisticsPhoneShared
      - path: Sources/BattisticsApp/Resources/AppIcon.icon
      - path: Sources/BattisticsApp/Resources/AppIcons
    dependencies:
      - package: BattisticsCore
        product: BattisticsRemote
      - target: BattisticsPhoneWidgets
    entitlements:
      path: Sources/BattisticsPhone/BattisticsPhone.entitlements
      properties:
        com.apple.security.application-groups: [group.com.doguyilmaz.Battistics.Remote]
        com.apple.developer.icloud-container-environment: Development
        com.apple.developer.icloud-container-identifiers: [iCloud.com.doguyilmaz.Battistics]
        com.apple.developer.icloud-services: [CloudKit]
        aps-environment: development
    info:
      path: Sources/BattisticsPhone/Info.plist
      properties:
        CFBundleDisplayName: Battistics Remote
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, tr]
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.utilities
        LSApplicationQueriesSchemes: [App-Prefs, app-prefs, prefs]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [fetch, remote-notification]
        NSSupportsLiveActivities: true
        BGTaskSchedulerPermittedIdentifiers: [com.doguyilmaz.Battistics.Remote.refresh]
        CFBundleIcons:
          CFBundlePrimaryIcon:
            CFBundleIconFiles: [original]
            UIPrerenderedIcon: true
          CFBundleAlternateIcons:
            gauge:
              CFBundleIconFiles: [gauge]
              UIPrerenderedIcon: true
            batbattery:
              CFBundleIconFiles: [batbattery]
              UIPrerenderedIcon: true
            stats:
              CFBundleIconFiles: [stats]
              UIPrerenderedIcon: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.doguyilmaz.Battistics.Remote
        DEVELOPMENT_TEAM: 5MYT4VYJFC
        "CODE_SIGN_IDENTITY[sdk=iphoneos*]": Apple Development
        PRODUCT_NAME: Battistics Remote
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_EMIT_LOC_STRINGS: YES

  BattisticsPhoneWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/BattisticsPhoneWidgets
      - path: Sources/BattisticsPhoneShared
    dependencies:
      - package: BattisticsCore
        product: BattisticsRemote
    entitlements:
      path: Sources/BattisticsPhoneWidgets/BattisticsPhoneWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.doguyilmaz.Battistics.Remote]
    info:
      path: Sources/BattisticsPhoneWidgets/Info.plist
      properties:
        CFBundleDisplayName: Battistics Remote
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.doguyilmaz.Battistics.Remote.Widgets
        DEVELOPMENT_TEAM: 5MYT4VYJFC
        "CODE_SIGN_IDENTITY[sdk=iphoneos*]": Apple Development
        PRODUCT_NAME: BattisticsRemoteWidgets
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_EMIT_LOC_STRINGS: YES

schemes:
  BattisticsPhone:
    build:
      targets:
        BattisticsPhone: all
    run:
      config: Debug
  Battistics:
    build:
      targets:
        Battistics: all
    run:
      config: Debug
