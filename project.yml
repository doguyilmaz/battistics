name: Battistics
options:
  bundleIdPrefix: com.dogukyilmaz
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ARCHS: arm64
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES

targets:
  Battistics:
    type: application
    platform: macOS
    sources:
      - path: Battistics
    info:
      path: Battistics/Support/Info.plist
      properties:
        CFBundleDisplayName: Battistics
        CFBundleShortVersionString: "1.0.0"
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: "Open source under the MIT License"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dogukyilmaz.Battistics
        PRODUCT_NAME: Battistics
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES

  BattisticsTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: BattisticsTests
    dependencies:
      - target: Battistics
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dogukyilmaz.BattisticsTests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Battistics.app/Contents/MacOS/Battistics"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  Battistics:
    build:
      targets:
        Battistics: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BattisticsTests
